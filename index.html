<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0e7490">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<title>Money Manager & Budgeting</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap">
<style>
:root{--bg:#f1f5f3;--card:#fff;--ink:#14272b;--mute:#62757a;--line:#d9e3df;--pri:#0f5c4d;--on:#fff;--inc:#14804a;--exp:#c23b4e;--soft:#e4efeb;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a1c;--card:#142427;--ink:#e6f0ee;--mute:#91a6a6;--line:#27393c;--pri:#3fb59b;--on:#06211b;--inc:#4cc58a;--exp:#f08092;--soft:#1b3235;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1a1c;--card:#142427;--ink:#e6f0ee;--mute:#91a6a6;--line:#27393c;--pri:#3fb59b;--on:#06211b;--inc:#4cc58a;--exp:#f08092;--soft:#1b3235;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;padding-bottom:84px}
#app{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:15px;font-weight:600;margin:0 0 12px;color:var(--mute)}
h2{font-size:16px;font-weight:800;margin:22px 0 8px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.hero{background:var(--pri);color:var(--on);border-radius:20px;padding:20px}
.hero small{opacity:.8;font-weight:600}
.hero .big{font-size:38px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.grid div{background:rgba(255,255,255,.14);border-radius:12px;padding:10px}
.grid b{display:block;font-size:14px;margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.mn{display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px}
.mn button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:18px}
.mn b{font-size:17px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row+.row{margin-top:8px}
.mute{color:var(--mute);font-size:13px}
.inc{color:var(--inc)}.exp{color:var(--exp)}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.three b{display:block;font-size:15px}
.bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--pri);border-radius:4px}
.bar i.over{background:var(--exp)}
.day{display:flex;justify-content:space-between;font-weight:800;font-size:13px;color:var(--mute);margin:16px 2px 6px}
.tx{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border:0}
.tx.g{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;column-gap:10px}
.tx.g>b{white-space:nowrap;text-align:right;min-width:76px}
.tx.g .x{padding:2px 6px}
.lst{max-height:60vh;overflow-y:auto;overflow-x:hidden}
.lst .day:first-child{margin-top:0}
.tx>div:first-child{flex:1;min-width:0}
.tx small{display:block;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x{border:0;background:none;color:var(--mute);font-size:20px;padding:4px 8px}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:600;background:var(--pri);color:var(--on)}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.sm{padding:6px 12px;font-size:13px}
.fab{position:fixed;right:max(16px,calc(50% - 244px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;font-size:28px;padding:0;box-shadow:0 4px 14px rgba(0,0,0,.25)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{border:0;background:none;padding:14px 0;font-size:12px;font-weight:600;color:var(--mute);border-top:3px solid transparent}
nav button.on{color:var(--pri);border-top-color:var(--pri)}
.empty{text-align:center;color:var(--mute);padding:26px 10px}
.empty a{color:var(--pri);font-weight:600;cursor:pointer}
dialog{border:0;border-radius:18px;padding:18px;width:min(92vw,420px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 12px}
dialog label{display:block;font-size:13px;color:var(--mute);margin-bottom:10px}
dialog input,dialog select{display:block;width:100%;margin-top:4px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:16px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px;font-weight:600}
.seg button.on{background:var(--pri);color:var(--on);border-color:var(--pri)}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.bi{width:90px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);text-align:right}
.chart{display:flex;align-items:flex-end;gap:8px;height:130px;margin-top:8px}
.chart>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.chart .pair{display:flex;align-items:flex-end;gap:3px;width:100%;flex:1}
.chart .pair i{flex:1;border-radius:3px 3px 0 0;min-height:2px}
.chart .pair i:first-child{background:var(--inc)}.chart .pair i:last-child{background:var(--exp)}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
:root[data-skin="sakura"]{--pri:#cf4378;--on:#fff;--soft:color-mix(in srgb,var(--pri) 14%,var(--card))}
:root[data-skin="lavender"]{--pri:#7359d1;--on:#fff;--soft:color-mix(in srgb,var(--pri) 14%,var(--card))}
:root[data-skin="sky"]{--pri:#2a78c7;--on:#fff;--soft:color-mix(in srgb,var(--pri) 14%,var(--card))}
.tx>div:first-child{cursor:pointer}
:root{--g1:#0e7490;--g2:#15803d;--inc:#12a15b;--exp:#ef476f}
body{background:linear-gradient(180deg,color-mix(in srgb,var(--g1) 22%,var(--bg)),var(--bg) 340px) no-repeat,var(--bg)}
.hero{background:radial-gradient(circle at 92% 8%,rgba(255,255,255,.3),transparent 45%),linear-gradient(135deg,var(--g1),var(--g2));color:#fff}
.btn:not(.ghost){background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff}
.card{border-radius:16px}
.bar{height:10px;border-radius:5px}
h2{border-left:4px solid var(--pri);padding-left:8px}
nav button.on{background:color-mix(in srgb,var(--pri) 10%,transparent)}
.ic{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;font-size:19px;flex:none}
:root[data-skin="sakura"]{--g1:#be185d;--g2:#c2410c}
:root[data-skin="lavender"]{--g1:#6d28d9;--g2:#2563eb}
:root[data-skin="sky"]{--g1:#1d4ed8;--g2:#0e7490}

:root[data-skin="forest"]{--pri:#15803d;--on:#fff;--g1:#166534;--g2:#0f766e;--soft:color-mix(in srgb,var(--pri) 14%,var(--card))}

dialog{max-height:90vh;overflow:auto}
.ipp{margin-top:8px;border:1px solid var(--line);border-radius:12px;padding:8px;background:var(--bg)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.tabs button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:4px 10px;font-size:12px}
.tabs button.on{background:var(--pri);color:var(--on);border-color:var(--pri)}
.eg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;max-height:190px;overflow:auto}

.eg button:hover{background:var(--soft)}

<canvas id="fx"></canvas>
<script>
const KEY="mm-v1",CI=["Salary","Bonus","Other income","Net Profit from Sales"];let CE=[];
const uid=()=>Math.random().toString(36).slice(2,9),pad=n=>String(n).padStart(2,"0");
const nw=new Date(),today=nw.getFullYear()+"-"+pad(nw.getMonth()+1)+"-"+pad(nw.getDate());
let M=today.slice(0,7),tab="ov",ty="exp";
const def=()=>({acc:[{id:"a1",name:"Cash",bal:0}],tx:[],bm:{},debt:[]});
let S=null;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.acc)S=def();
function fix(){S.bcat=S.bcat||{sale:["Product sales","Service income"],cost:["Purchase of goods","Packaging","Freight in"],exp:["Rent","Salaries","Utilities","Marketing","Transport","Other expenses"],oinc:["Interest","Other income"]};S.ins=S.ins||[];S.ev=S.ev||[];S.nt=S.nt||[];S.gm=S.gm||{};S.pf=S.pf||{};S.co=S.co||{};S.inv=S.inv||[];S.invN=S.invN||0;S.recN=S.recN||0;S.bm=S.bm||{};S.bz=S.bz||{r:[],conf:{}};S.acc.forEach(a=>a.ty=a.ty||"liq");
const DC=[["Food","🍜","#e07a3f"],["Transport","🚌","#3a86c8"],["Bills","🧾","#8a63d2"],["Shopping","🛍️","#d0467a"],["Health","💊","#2a9d8f"],["Entertainment","🎬","#c9a227"],["Other","📦","#6c7a89"],["Saving","🐷","#4c9f4c"]];
S.cats=S.cats||DC.map(([n,e,c])=>({n,e,c,g:n=="Saving"?"oth":"reg"}));CE=S.cats.map(c=>c.n);document.documentElement.dataset.skin=S.skin||""}
fix();
const save=q=>{if(!q)S.ts=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(!q)queuePush()};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const RM=n=>(n<0?"−":"")+(S.cur||"RM")+" "+Math.abs(n).toLocaleString("en-MY",{minimumFractionDigits:2,maximumFractionDigits:2});
const tot=(a,t)=>a.filter(x=>x.type==t).reduce((s,x)=>s+x.amt,0);
const eff=a=>S.tx.reduce((s,t)=>s+(t.acc==a.id?(t.type=="inc"||t.type=="adj"?t.amt:-t.amt):0)+(t.to==a.id?t.amt:0),0)+S.bz.r.reduce((s,r)=>s+(r.acc==a.id&&r.paid?(r.k=="sale"||r.k=="oinc"?r.amt:-r.amt):0),0);
const isL=a=>["lia","pay","acr","hld"].includes(a.ty);
const bal=a=>isL(a)?a.bal-eff(a):a.bal+eff(a);
const dsum=d=>S.debt.filter(x=>x.dir==d&&!x.done).reduce((s,x)=>s+x.amt,0);
const mlabel=m=>new Date(m+"-01T00:00").toLocaleDateString((S.lang=="ms"?"ms-MY":"en-GB"),{month:"long",year:"numeric"});
const mshort=m=>new Date(m+"-01T00:00").toLocaleDateString((S.lang=="ms"?"ms-MY":"en-GB"),{month:"short"});
function shiftM(m,n){const[y,k]=m.split("-").map(Number),d=new Date(y,k-1+n,1);return d.getFullYear()+"-"+pad(d.getMonth()+1)}
const mv=n=>{M=shiftM(M,n);draw()};
const go=t=>{tab=t;draw();scrollTo(0,0)};
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),2200)}
const mnav=()=>`<div class="mn"><button aria-label="Previous month" onclick="mv(-1)">‹</button><b>${mlabel(M)}</b><button aria-label="Next month" onclick="mv(1)">›</button></div>`;
const catTot=mt=>{const o={};mt.filter(t=>t.type=="exp").forEach(t=>o[t.cat]=(o[t.cat]||0)+t.amt);return Object.entries(o).sort((a,b)=>b[1]-a[1])};
const catBars=l=>{const mx=l[0]?l[0][1]:1;return l.map(([c,v])=>{const k=S.cats.find(x=>x.n==c)||{e:"🧾",c:"#6c7a89"};return `<div style="margin-bottom:12px"><div class="row"><span>${ico(k.e,18)} ${esc(c)}</span><b>${RM(v)}</b></div><div class="bar"><i style="width:${v/mx*100}%;background:${k.c}"></i></div></div>`}).join("")};
const empty=m=>`<div class="empty">${m} <a onclick="addTx()">Add one</a></div>`;

function draw(){
  $("#main").innerHTML=({ov,dl,bg,rp,mr,bz,iv,cal,nt,gm,ist,ch})[tab]();
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t==(tab=="iv"?"bz":["cal","nt","gm","ist","ch"].includes(tab)?"mr":tab)));
  $("#pchip").innerHTML=`<span style="display:flex">${pav(26)}</span>${S.pf.name?`<span>${esc(S.pf.name)}</span>`:""}`;
  applyWp();
  {const n=chUnread(),b=$("#mbd");if(b){b.style.display=n?"inline-block":"none";b.textContent=n}const cb=$("#cbd");if(cb){cb.style.display=n?"inline-block":"none";cb.textContent=n}document.title=(n?"("+n+") ":"")+"Money Manager & Budgeting"}
  fxApply();
  trDom(document.body);
}

function ov(){
  const mt=S.tx.filter(t=>t.date.startsWith(M)),inc=tot(mt,"inc"),exp=tot(mt,"exp");
  const pr=S.tx.filter(t=>t.date.slice(0,7)<M),open=pa().reduce((s,a)=>s+a.bal,0);
  const adj=l=>l.filter(t=>t.type=="adj").reduce((s,t)=>s+t.amt,0),bf=open+tot(pr,"inc")-tot(pr,"exp")+adj(pr),sm=ty=>pa().filter(a=>ty.includes(a.ty)).reduce((s,a)=>s+bal(a),0),accs=sm(["liq","sav","oth","pre","aci"]),ow=sm(["rec"]),oe=sm(["lia","pay","acr","hld"]);
  const cl=catTot(mt);
  return `<div class="hero"><small>Net worth</small><div class="big">${RM(accs+ow-oe)}</div>
  <div class="grid"><div><small>Accounts</small><b>${RM(accs)}</b></div><div><small>Owed to me</small><b>${RM(ow)}</b></div><div><small>I owe</small><b>${RM(oe)}</b></div></div></div>
  ${mnav()}
  <div class="card"><div class="three"><div><span class="mute">Income</span><b class="inc">${RM(inc)}</b></div><div><span class="mute">Expenses</span><b class="exp">${RM(exp)}</b></div><div><span class="mute">Net</span><b>${RM(inc-exp)}</b></div></div>
  <div class="row mute" style="margin-top:12px"><span>Brought forward</span><span>${RM(bf)}</span></div><div class="row mute"><span>Carry forward</span><span>${RM(bf+inc-exp+adj(mt))}</span></div></div>
  <h2>Account balance adjustments</h2><div class="card" style="padding:4px 14px">${mt.filter(t=>t.type=="adj").map(txRow).join("")||`<div class="mute" style="padding:10px 0">No adjustments this month.</div>`}</div><button class="btn ghost sm" onclick="addTx(null,'adj')">Add adjustment</button>${accGroups()}
  <h2>Spending by category</h2><div class="card">${cl.length?catBars(cl):empty("No expenses this month.")}</div>
  <button class="btn fab" aria-label="Add transaction" onclick="addTx()">+</button>`;
}

function dl(){
  const mt=S.tx.filter(t=>t.date.startsWith(M)).sort((a,b)=>b.date.localeCompare(a.date));
  const days={};mt.forEach(t=>(days[t.date]=days[t.date]||[]).push(t));
  const inc=tot(mt,"inc"),exp=tot(mt,"exp");
  let h=mnav()+`<div class="card"><div class="three"><div><span class="mute">Income</span><b class="inc">${RM(inc)}</b></div><div><span class="mute">Expenses</span><b class="exp">${RM(exp)}</b></div><div><span class="mute">Net</span><b>${RM(inc-exp)}</b></div></div></div>`;
  if(!mt.length)h+=empty("No transactions this month.");
  Object.keys(days).forEach(d=>{
    const l=days[d],net=tot(l,"inc")-tot(l,"exp");
    h+=`<div class="day"><span>${new Date(d+"T00:00").toLocaleDateString((S.lang=="ms"?"ms-MY":"en-GB"),{weekday:"short",day:"numeric",month:"short"})}</span><span>${RM(net)}</span></div><div class="card" style="padding:4px 14px">`;
    h+=l.map(txRow).join("")+`</div>`;
  });
  return h+`<button class="btn fab" aria-label="Add transaction" onclick="addTx()">+</button>`;
}
function delTx(id){const t=S.tx.find(x=>x.id==id);if(!t)return;modal("Delete this transaction?",`<p class="mute">${esc(t.cat)} · ${RM(t.amt)} · ${t.date}${t.who?" · "+esc(t.who):""}${t.inst?"<br>It is linked to an installment, which will be reopened.":""}</p>`,()=>doDelTx(id),"Delete")}
function doDelTx(id){S.ins.forEach(p=>p.tx=p.tx.filter(x=>x!=id));S.tx=S.tx.filter(t=>t.id!=id);if(dlg.open)dlg.close();save();draw();toast("Transaction deleted")}

function spentIn(m,c){return S.tx.filter(t=>(t.type=="exp"||t.type=="tr")&&t.cat==c&&t.date.startsWith(m)).reduce((x,t)=>x+t.amt,0)}
function bgData(m){
  const ms=[...S.tx.map(t=>t.date.slice(0,7)),...Object.keys(S.bm)].sort(),st=ms[0],o={};
  if(!st||m<st){CE.forEach(c=>o[c]={bf:0,b:0,s:0,cf:0});return o}
  let cur=st,cf={};
